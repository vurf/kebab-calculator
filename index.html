<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Шашлыкатор</title>
  <style>
/* ============================================================
   ШАШЛЫКАТОР — design system
   Dark-first, warm charcoal + ember. SF Pro (system).
   ============================================================ */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --font: -apple-system, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;

  /* ember accent (chosen: flat #FF6A1A family) */
  --ember:      #FF6A1A;
  --ember-hot:  #FFB02E;
  --ember-deep: #E8420E;
  --ember-soft: #FF8A47;

  /* wood */
  --wood:  #A86A38;
  --wood-d:#7A4A24;

  /* springs / easings */
  --spring: cubic-bezier(.34,1.56,.64,1);
  --spring-soft: cubic-bezier(.22,1,.36,1);
  --ease: cubic-bezier(.4,0,.2,1);
}

/* ---------- DARK (primary) ---------- */
.app-root {
  --bg-0:   #0C0A09;   /* deepest */
  --bg-1:   #141019;   /* page (very subtle warm-purple char) */
  --bg-grad-a:#1A1310;
  --bg-grad-b:#0B0908;
  --card:   #1C1714;
  --card-hi:#241D18;
  --line:   rgba(255,255,255,0.08);
  --line-strong: rgba(255,255,255,0.14);
  --metal-a:#3A332E;
  --metal-b:#181410;
  --txt:    #F6EFE6;
  --txt-2:  #B7ADA2;
  --txt-3:  #7E756C;
  --chip:   rgba(255,255,255,0.06);
  --chip-active: rgba(255,106,26,0.16);
  --shadow: 0 24px 60px rgba(0,0,0,.55);
  --glow:   0 0 60px rgba(255,106,26,.35);
  color-scheme: dark;
}

/* ---------- LIGHT ---------- */
.app-root.theme-light {
  --bg-0:   #FBF4EA;
  --bg-1:   #F4EADB;
  --bg-grad-a:#FBF3E7;
  --bg-grad-b:#EFE2CE;
  --card:   #FFFFFF;
  --card-hi:#FFFDF9;
  --line:   rgba(40,28,18,0.08);
  --line-strong: rgba(40,28,18,0.14);
  --metal-a:#C9BBA9;
  --metal-b:#8B7B68;
  --txt:    #251A11;
  --txt-2:  #6B5D4E;
  --txt-3:  #9A8C7B;
  --chip:   rgba(40,28,18,0.05);
  --chip-active: rgba(255,106,26,0.14);
  --shadow: 0 24px 50px rgba(70,40,15,.16);
  --glow:   0 0 50px rgba(255,106,26,.28);
  color-scheme: light;
}

/* ============================================================
   Stage / scaling
   ============================================================ */
html, body {
  margin: 0; height: 100%;
  background: #050403;
  font-family: var(--font);
  overflow: hidden;
}
#stage {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(120% 80% at 50% -10%, #1a1411 0%, #070504 60%),
    #050403;
}
#device-wrap { transform-origin: center center; }

/* ============================================================
   App shell (fills the iOS device content area)
   ============================================================ */
.app-root {
  position: absolute; inset: 0;
  background:
    radial-gradient(130% 70% at 50% 8%, var(--bg-grad-a) 0%, var(--bg-1) 48%, var(--bg-grad-b) 100%);
  color: var(--txt);
  font-family: var(--font);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background .6s var(--ease), color .4s var(--ease);
}
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: 86px 22px 40px;
}

/* ============================================================
   Typography
   ============================================================ */
.kicker {
  font-size: 13px; font-weight: 700; letter-spacing: .18em;
  text-transform: uppercase; color: var(--ember);
}
.h-hero {
  font-size: 40px; font-weight: 800; line-height: 1.02;
  letter-spacing: -.02em; text-wrap: balance;
}
.h-1 { font-size: 30px; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }
.h-2 { font-size: 23px; font-weight: 750; letter-spacing: -.01em; }
.sub { font-size: 17px; font-weight: 500; color: var(--txt-2); line-height: 1.35; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

/* ============================================================
   Buttons
   ============================================================ */
.btn {
  border: none; font-family: var(--font); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  user-select: none; transition: transform .18s var(--spring), filter .2s, box-shadow .3s;
}
.btn:active { transform: scale(.955); }

.btn-primary {
  width: 100%; height: 64px; border-radius: 22px;
  font-size: 20px; font-weight: 750; color: #1A0E05;
  background: linear-gradient(180deg, var(--ember-hot) 0%, var(--ember) 52%, var(--ember-deep) 100%);
  box-shadow: 0 12px 30px rgba(232,66,14,.42), inset 0 1px 0 rgba(255,255,255,.45);
  position: relative; overflow: hidden;
}
.btn-primary::after {
  content:""; position:absolute; inset:0;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
  transform: translateX(-120%);
}
.btn-primary.shine::after { animation: shine 2.6s var(--ease) infinite; }

.btn-ghost {
  height: 56px; border-radius: 18px; padding: 0 22px;
  font-size: 17px; font-weight: 650; color: var(--txt);
  background: var(--chip); border: 1px solid var(--line);
}
.btn-pill {
  height: 48px; border-radius: 999px; padding: 0 22px;
  font-size: 16px; font-weight: 650; color: var(--txt);
  background: var(--chip); border: 1px solid var(--line);
}

/* ============================================================
   Cards
   ============================================================ */
.card {
  background: linear-gradient(180deg, var(--card-hi), var(--card));
  border: 1px solid var(--line);
  border-radius: 30px;
  box-shadow: var(--shadow);
}

/* ============================================================
   MANGAL (brazier) + COALS + FIRE + SMOKE + SKEWERS
   ============================================================ */
.grill {
  position: relative;
  width: 100%;
  --grill-h: 150px;
}

/* the metal body */
.mangal {
  position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 100%; height: var(--grill-h);
}
.mangal-body {
  position: absolute; left: 4%; right: 4%; bottom: 0; height: 64%;
  border-radius: 10px 10px 16px 16px;
  background:
    linear-gradient(180deg, var(--metal-a) 0%, var(--metal-b) 100%);
  box-shadow:
    inset 0 2px 1px rgba(255,255,255,.14),
    inset 0 -10px 24px rgba(0,0,0,.6),
    0 18px 30px rgba(0,0,0,.5);
}
/* tapered top opening */
.mangal-top {
  position: absolute; left: 0; right: 0; top: 36%; height: 30%;
  background:
    linear-gradient(180deg, #0a0706 0%, #1a1310 100%);
  border-radius: 50% / 60%;
  box-shadow: inset 0 8px 18px rgba(0,0,0,.85);
  transform: scaleX(1.02);
}
.mangal-legs::before, .mangal-legs::after {
  content:""; position:absolute; bottom:-26px; width:8px; height:30px;
  background: linear-gradient(180deg,var(--metal-a),var(--metal-b));
  border-radius: 0 0 4px 4px;
}
.mangal-legs::before { left: 16%; transform: rotate(8deg); }
.mangal-legs::after  { right: 16%; transform: rotate(-8deg); }

/* coal bed */
.coalbed {
  position: absolute; left: 10%; right: 10%; top: 40%; height: 26%;
  display: flex; flex-wrap: wrap; gap: 3px;
  align-items: center; justify-content: center;
  padding: 4px 8px; overflow: hidden;
}
.coal {
  width: 13px; height: 11px; border-radius: 4px;
  background: radial-gradient(circle at 50% 40%, #2a211c, #120c0a 80%);
  position: relative;
}
.coal.hot {
  background: radial-gradient(circle at 50% 45%, var(--ember-hot) 0%, var(--ember) 35%, #7a1c06 75%, #2a0d04 100%);
  box-shadow: 0 0 10px 2px rgba(255,106,26,.7);
  animation: coalFlicker 1.8s var(--ease) infinite;
}
@keyframes coalFlicker {
  0%,100% { filter: brightness(1);   box-shadow: 0 0 10px 2px rgba(255,106,26,.6); }
  45%     { filter: brightness(1.45);box-shadow: 0 0 16px 4px rgba(255,176,46,.85); }
  70%     { filter: brightness(.82); box-shadow: 0 0 7px 1px rgba(255,106,26,.45); }
}

/* ambient ember glow above the bed */
.ember-glow {
  position: absolute; left: 50%; top: 28%; transform: translateX(-50%);
  width: 78%; height: 60%; pointer-events: none;
  background: radial-gradient(ellipse at 50% 70%, rgba(255,120,30,.55), rgba(255,80,10,.12) 45%, transparent 70%);
  filter: blur(6px);
  opacity: .0; transition: opacity .8s var(--ease);
  animation: glowBreath 3.4s var(--ease) infinite;
}
.grill.lit .ember-glow { opacity: 1; }
@keyframes glowBreath { 0%,100%{opacity:.7} 50%{opacity:1} }

/* flames */
.flames { position:absolute; left:50%; top:18%; transform:translateX(-50%);
  width:70%; height:60%; pointer-events:none; opacity:0; transition:opacity .5s; }
.grill.fire .flames { opacity: 1; }
.flame {
  position:absolute; bottom:0; width:26px; height:60px;
  background: linear-gradient(180deg, #fff3c4 0%, var(--ember-hot) 30%, var(--ember-deep) 75%, transparent 100%);
  border-radius: 50% 50% 46% 46% / 75% 75% 30% 30%;
  filter: blur(.5px);
  transform-origin: 50% 100%;
  animation: flame 1.1s var(--ease) infinite;
  mix-blend-mode: screen;
}
@keyframes flame {
  0%,100% { transform: scaleY(1)   scaleX(1)   translateY(0);   opacity:.92; }
  35%     { transform: scaleY(1.4) scaleX(.82) translateY(-6px); opacity:1; }
  60%     { transform: scaleY(.85) scaleX(1.12) translateY(2px); opacity:.8; }
}

/* smoke particles */
.smoke-layer { position:absolute; left:0; right:0; bottom:42%; height:200px; pointer-events:none; overflow:visible; }
.smoke {
  position:absolute; bottom:0;
  width:42px; height:42px; border-radius:50%;
  background: radial-gradient(circle, rgba(220,210,200,.5), rgba(180,170,160,0) 70%);
  filter: blur(7px);
  opacity:0;
  animation: smokeRise var(--dur,5s) var(--ease) infinite;
  animation-delay: var(--del, 0s);
}
@keyframes smokeRise {
  0%   { transform: translate(0,0) scale(.4); opacity:0; }
  15%  { opacity:.55; }
  60%  { opacity:.4; }
  100% { transform: translate(var(--dx,10px),-180px) scale(1.8); opacity:0; }
}

/* skewers + meat */
.skewer-rod {
  position:absolute; height:5px; border-radius:3px;
  background: linear-gradient(180deg,#e9e3da,#9a948c 60%,#6c665f);
  box-shadow: 0 1px 2px rgba(0,0,0,.5);
}
.skewer-rod::before { /* handle ring */
  content:""; position:absolute; left:-10px; top:50%; transform:translateY(-50%);
  width:10px; height:10px; border-radius:50%;
  border:2.5px solid #c9c2b8; background:transparent;
}
.piece {
  position:absolute; top:50%; transform:translateY(-50%);
  border-radius: 6px;
  box-shadow: inset 0 2px 2px rgba(255,255,255,.18), inset 0 -3px 5px rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.4);
}
.piece.meat  { background: linear-gradient(150deg,#A23C1E 0%, #7E2A14 45%, #531608 100%); }
.piece.meat.cooked { background: linear-gradient(150deg,#7a3a1c 0%, #4a2210 50%, #2c1206 100%); }
.piece.onion { background: radial-gradient(circle at 50% 40%, #fff,#f3e9d8 55%, #d9c39a); }
.piece.tomato{ background: radial-gradient(circle at 40% 35%, #ff7a5c,#d62f1e 70%); }
.piece.pepper{ background: linear-gradient(150deg,#36b34a,#1d7a2e); }
.piece.pop { animation: piecePop .42s var(--spring) both; }
@keyframes piecePop {
  0% { transform: translateY(-50%) scale(0) rotate(-25deg); opacity:0; }
  60%{ transform: translateY(-50%) scale(1.18) rotate(6deg); opacity:1; }
  100%{ transform: translateY(-50%) scale(1) rotate(0); }
}

/* char marks */
.char { position:absolute; inset:0; border-radius:6px; opacity:0; transition:opacity .6s;
  background: repeating-linear-gradient(115deg, transparent 0 6px, rgba(0,0,0,.28) 6px 9px); }
.piece.cooked .char { opacity:.7; }

/* ============================================================
   Generic motion
   ============================================================ */
@keyframes shine { 0%{transform:translateX(-120%)} 60%,100%{transform:translateX(120%)} }
@keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes pulseRing {
  0%{ box-shadow:0 0 0 0 rgba(255,106,26,.5);} 70%{box-shadow:0 0 0 22px rgba(255,106,26,0);} 100%{box-shadow:0 0 0 0 rgba(255,106,26,0);}
}
@keyframes riseIn { from{opacity:0; transform:translateY(26px);} to{opacity:1; transform:none;} }
@keyframes scaleIn { from{opacity:0; transform:scale(.86);} to{opacity:1; transform:scale(1);} }
.rise { animation: riseIn .6s var(--spring-soft) both; }
.screen-anim { animation: screenIn .5s var(--spring-soft) both; }
@keyframes screenIn { from{ opacity:0; transform: scale(1.02); } to{ opacity:1; transform:none; } }

/* haptic flash overlay */
.haptic-flash {
  position:absolute; inset:0; pointer-events:none; z-index:90;
  background: radial-gradient(circle at 50% 60%, rgba(255,176,46,.22), transparent 60%);
  opacity:0;
}
.haptic-flash.go { animation: hapticFlash .32s var(--ease); }
@keyframes hapticFlash { 0%{opacity:0} 30%{opacity:1} 100%{opacity:0} }

/* progress dots */
.dots { display:flex; gap:7px; }
.dots .dot { width:7px; height:7px; border-radius:50%; background:var(--line-strong); transition:all .35s var(--spring); }
.dots .dot.done { background: var(--ember); }
.dots .dot.active { width:22px; border-radius:5px; background: var(--ember); }

/* option tiles */
.opt {
  width:100%; border-radius:22px; padding:20px 20px;
  background: var(--card); border:1.5px solid var(--line);
  display:flex; align-items:center; gap:16px; cursor:pointer;
  transition: transform .2s var(--spring), border-color .2s, background .2s, box-shadow .3s;
  text-align:left;
}
.opt:active { transform: scale(.98); }
.opt.sel { border-color: var(--ember); background: var(--chip-active); box-shadow: 0 0 0 4px rgba(255,106,26,.12); }
.opt .opt-emoji { font-size:34px; line-height:1; filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
.opt .opt-t { font-size:19px; font-weight:700; }
.opt .opt-d { font-size:14px; color:var(--txt-2); margin-top:2px; }

/* number stepper */
.stepper { display:flex; align-items:center; justify-content:center; gap:26px; }
.step-btn {
  width:64px; height:64px; border-radius:50%; border:1.5px solid var(--line-strong);
  background:var(--chip); color:var(--txt); font-size:32px; font-weight:600;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition: transform .15s var(--spring), background .2s;
}
.step-btn:active { transform: scale(.9); background: var(--chip-active); }
.step-num { font-size:96px; font-weight:850; letter-spacing:-.04em; min-width:120px; text-align:center; font-variant-numeric: tabular-nums; }

/* placeholder slot */
.ph {
  border:1.5px dashed var(--line-strong); border-radius:18px;
  background: repeating-linear-gradient(45deg, transparent 0 10px, rgba(255,255,255,.025) 10px 20px);
  display:flex; align-items:center; justify-content:center;
  color:var(--txt-3); font-family: ui-monospace,"SF Mono",Menlo,monospace; font-size:11px;
  text-align:center; padding:8px;
}

/* result stat row */
.stat {
  display:flex; align-items:center; gap:16px; padding:16px 18px;
  border-bottom:1px solid var(--line);
}
.stat:last-child { border-bottom:none; }
.stat-ic { width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; background:var(--chip); flex-shrink:0; }
.stat-label { font-size:16px; font-weight:600; color:var(--txt-2); flex:1; }
.stat-val { font-size:26px; font-weight:800; letter-spacing:-.02em; font-variant-numeric: tabular-nums; }
.stat-unit { font-size:15px; font-weight:600; color:var(--txt-3); margin-left:3px; }

/* hide scrollbars inside device */
.app-root ::-webkit-scrollbar { width:0; height:0; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="device-wrap">
      <div id="app"></div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- data + calc engine -->
  <script>
/* ШАШЛЫКАТОР — data + calculation engine (attaches to window) */
(function () {
  // ---- meat options ----
  const MEATS = [
    { id: 'pork',    name: 'Свинина',  emoji: '🥩', note: 'Классика шашлыка', tone: '#A23C1E' },
    { id: 'chicken', name: 'Курица',   emoji: '🍗', note: 'Лёгкое и быстрое',  tone: '#C98A3A' },
    { id: 'lamb',    name: 'Баранина', emoji: '🍖', note: 'По-кавказски',      tone: '#8E3119' },
    { id: 'beef',    name: 'Говядина', emoji: '🥩', note: 'Сочно и сытно',     tone: '#7E2A14' },
    { id: 'mix',     name: 'Микс',     emoji: '🔥', note: 'Всего понемногу',   tone: '#E8420E' },
  ];

  // ---- appetite multipliers (kg raw meat per adult) ----
  const APPETITE = {
    light:  { id:'light',  name:'Лёгкий',          emoji:'🥗', meat:0.25, note:'Поедим в меру' },
    normal: { id:'normal', name:'Обычный',         emoji:'🍖', meat:0.35, note:'Нормальный аппетит' },
    beast:  { id:'beast',  name:'Очень голодные',  emoji:'🔥', meat:0.50, note:'Будем сметать всё' },
  };

  const KIDS = {
    none: { id:'none', name:'Нет',     emoji:'🙅', factor:0,    note:'Только взрослые' },
    few:  { id:'few',  name:'Немного', emoji:'🧒', factor:0.35, note:'Пара детей' },
    many: { id:'many', name:'Много',   emoji:'👨‍👩‍👧‍👦', factor:0.6, note:'Целая компания детворы' },
  };

  const ALCO = {
    none:  { id:'none',  name:'Нет',            emoji:'🚫', beer:0,    strong:0,    soft:0.7, note:'Безалкогольно' },
    some:  { id:'some',  name:'Немного',        emoji:'🍷', beer:0.5,  strong:0.05, soft:0.5, note:'По чуть-чуть' },
    yes:   { id:'yes',   name:'Конечно будет',  emoji:'🍻', beer:1.0,  strong:0.15, soft:0.4, note:'Как полагается' },
  };

  // questions metadata (for the flow)
  const QUESTIONS = [
    { id:'count',    kind:'count',   title:'Сколько вас будет?',   sub:'Считаем взрослых гостей' },
    { id:'kids',     kind:'options', title:'Будут дети?',          sub:'Они едят меньше — учтём', opts:Object.values(KIDS) },
    { id:'alcohol',  kind:'options', title:'Будет алкоголь?',      sub:'Прикинем напитки',        opts:Object.values(ALCO) },
    { id:'appetite', kind:'options', title:'Какой аппетит?',       sub:'От этого зависит порция', opts:Object.values(APPETITE) },
    { id:'meat',     kind:'meat',    title:'Какое мясо?',          sub:'Выбери основу для шампуров', opts:MEATS },
  ];

  const DEFAULTS = { count:6, kids:'none', alcohol:'some', appetite:'normal', meat:'pork' };

  function round(n, step){ return Math.round(n/step)*step; }

  function calc(a) {
    const adults = a.count || 0;
    const kidsF  = KIDS[a.kids]?.factor ?? 0;
    const app    = APPETITE[a.appetite] || APPETITE.normal;
    const alco   = ALCO[a.alcohol] || ALCO.some;

    // effective "eaters" — kids count as fraction
    const eaters = adults * (1 + kidsF);

    const meat   = eaters * app.meat;            // kg raw meat
    const onion  = meat * 0.25;                  // kg onion (marinade + serve)
    const veg    = adults * 0.30 + (adults*kidsF)*0.15; // kg fresh veg / greens
    const charcoal = meat * 1.45 + 1.0;          // kg charcoal incl. base
    const bread  = Math.ceil(eaters * 0.6);      // pita / lavash pieces
    const drinks = adults * (alco.beer + alco.strong) + eaters * alco.soft; // L total
    const sauce  = round(eaters * 0.08, 0.05);   // kg sauces

    // skewers: ~ pieces of meat. 1 skewer feeds ~portion; cap visualization
    const skewers = Math.max(2, Math.ceil(meat / 0.35));

    return {
      meat:    round(meat, 0.1),
      onion:   round(onion, 0.1),
      charcoal:round(charcoal, 0.5),
      veg:     round(veg, 0.1),
      drinks:  round(drinks, 0.5),
      bread,
      sauce,
      skewers,
      eaters: Math.round(eaters*10)/10,
    };
  }

  // shopping list builder
  function shoppingList(a, r) {
    const meatName = (MEATS.find(m=>m.id===a.meat)||MEATS[0]).name;
    return [
      { ic:'🍖', label:`${meatName}`,        val:r.meat,    unit:'кг' },
      { ic:'🧅', label:'Лук',                 val:r.onion,   unit:'кг' },

          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'

      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',

      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'

  );

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}

            <circle cx="11" cy="3" r="2.5" fill={muted}/>

          </svg>

      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',

    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';

    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,

          width: 30, height: 30, borderRadius: 7, background: icon,

        }} />

      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>

          position: 'absolute', bottom: 0, right: 0,

  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({

    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,

      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark

          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',

          </React.Fragment>

      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>

          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>

}

function TweakRow({ label, value, children, inline = false }) {

      <div className="twk-lbl">
        <span>{label}</span>

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  <script type="text/babel">
/* grill.jsx — the BBQ scene: mangal, glowing coals, smoke, skewers with meat.
   Reused on hero, progress indicator, signature & results. */

function Smoke({ count = 6, intensity = 1 }) {
  const puffs = React.useMemo(() => (
    Array.from({ length: count }).map((_, i) => ({
      left: 12 + (i / count) * 72 + (Math.random() * 8 - 4),
      dur: 4.5 + Math.random() * 3,
      del: -(Math.random() * 5),
      dx: (Math.random() * 40 - 20),
      scale: 0.7 + Math.random() * 0.8,
    }))
  ), [count]);
  return (
    <div className="smoke-layer" style={{ opacity: intensity }}>
      {puffs.map((p, i) => (
        <div key={i} className="smoke" style={{
          left: p.left + '%',
          '--dur': p.dur + 's',
          '--del': p.del + 's',
          '--dx': p.dx + 'px',
          width: (42 * p.scale) + 'px',
          height: (42 * p.scale) + 'px',
        }} />
      ))}
    </div>
  );
}

// one skewer with threaded pieces
function Skewer({ width, top, pieceSize, pieces, cooked }) {
  const gap = pieceSize * 0.18;
  const total = pieces.length;
  const span = total * pieceSize + (total - 1) * gap;
  const startX = (width - span) / 2;
  return (
    <div className="skewer-rod" style={{
      width: width + 'px', top: top + '%', left: '50%',
      transform: 'translateX(-50%)',
    }}>
      {pieces.map((type, i) => (
        <div key={i}
          className={`piece ${type} ${cooked ? 'cooked' : ''} ${type === 'meat' && pieces.__pop ? 'pop' : ''}`}
          style={{
            width: pieceSize + 'px',
            height: (type === 'onion' || type === 'tomato' ? pieceSize * 0.82 : pieceSize) + 'px',
            left: (startX + i * (pieceSize + gap)) + 'px',
          }}>
          <div className="char" />
        </div>
      ))}
    </div>
  );
}

/* build the piece pattern for a skewer */
function buildPieces(meatCount) {
  const fillers = ['onion', 'pepper', 'tomato'];
  const out = [];
  for (let i = 0; i < meatCount; i++) {
    out.push('meat');
    if (i < meatCount - 1) out.push(fillers[i % fillers.length]);
  }
  return out;
}

function GrillScene({
  height = 150,
  skewers = 0,        // number of loaded skewers
  meatSize = 'normal',// 'light' | 'normal' | 'beast'
  lit = false,        // coals glowing
  fire = false,       // open flames
  smoke = 0,          // 0..1 smoke intensity
  coalCount = 22,
}) {
  const sizeMap = { light: 11, normal: 14, beast: 18 };
  const meatPerSkewerMap = { light: 5, normal: 4, beast: 3 };
  const pieceSize = sizeMap[meatSize] ?? 14;
  const meatPer = meatPerSkewerMap[meatSize] ?? 4;

  const shown = Math.min(skewers, 5);
  const rows = Array.from({ length: shown });

  // coal bed — fraction hot depends on lit
  const coals = Array.from({ length: coalCount });

  return (
    <div className={`grill ${lit ? 'lit' : ''} ${fire ? 'fire' : ''}`} style={{ '--grill-h': height + 'px', height: height + 'px' }}>
      {smoke > 0 && <Smoke count={5 + Math.round(smoke * 4)} intensity={smoke} />}

      <div className="mangal">
        <div className="mangal-body mangal-legs" />
        <div className="mangal-top" />
        <div className="coalbed">
          {coals.map((_, i) => (
            <div key={i} className={`coal ${lit && (i % 3 !== 0) ? 'hot' : ''}`}
              style={{ animationDelay: (i * 0.13) + 's' }} />
          ))}
        </div>
        <div className="ember-glow" />

        {fire && (
          <div className="flames">
            {Array.from({ length: 6 }).map((_, i) => (
              <div key={i} className="flame" style={{
                left: (8 + i * 15) + '%',
                animationDelay: (i * 0.17) + 's',
                height: (48 + (i % 3) * 16) + 'px',
              }} />
            ))}
          </div>
        )}

        {/* skewers laid across the opening */}
        <div style={{ position: 'absolute', left: '8%', right: '8%', top: '8%', bottom: '50%' }}>
          {rows.map((_, i) => {
            const top = shown <= 1 ? 50 : (i / (shown - 1)) * 78 + 6;
            return (
              <Skewer key={i}
                width={Math.round((height * 1.7))}

  <script type="text/babel">
/* screens.jsx — Hero, QuestionFlow (Tinder cards), Results */

const { useState, useRef, useEffect, useCallback } = React;

/* ---------- animated count-up ---------- */
function AnimatedNumber({ value, decimals = 1, dur = 1100, delay = 0 }) {
  const [n, setN] = useState(0);
  const ref = useRef();
  useEffect(() => {
    let raf, start;
    const from = 0, to = value;
    const t = setTimeout(() => {
      const step = (ts) => {
        if (!start) start = ts;
        const p = Math.min(1, (ts - start) / dur);
        const e = 1 - Math.pow(1 - p, 3); // easeOutCubic
        setN(from + (to - from) * e);
        if (p < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    }, delay);
    return () => { clearTimeout(t); cancelAnimationFrame(raf); };
  }, [value]);
  const txt = decimals === 0 ? Math.round(n).toString() : n.toFixed(decimals);
  return <span ref={ref} className="mono-num">{txt}</span>;
}

/* ============================================================
   HERO
   ============================================================ */
function Hero({ onStart }) {

  const commit = useCallback((dir) => {
    setExiting(dir || 1);
    haptic('medium');
    setTimeout(() => onAdvance(), 300);
  }, [onAdvance, haptic]);

  // pointer drag
  const onDown = (e) => {
    if (q.kind === 'count') return; // count card uses stepper, no swipe-away
    dragging.current = true;
    startX.current = (e.touches ? e.touches[0].clientX : e.clientX);

  const onMove = (e) => {
    if (!dragging.current) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    setDrag(x - startX.current);
  };
  const onUp = () => {
    if (!dragging.current) return;

  <script type="text/babel">
/* skewer.jsx — SIGNATURE MOMENT.
   Drag the giant skewer across; meat threads on piece-by-piece;
   fire ignites and smoke rises at the end. */

function SignatureSkewer({ count, meatSize, onDone, haptic, flash }) {
  const { useState, useRef, useEffect } = React;
  const TOTAL = Math.max(6, Math.min(12, Math.round(count * 1.2)));
  const [progress, setProgress] = useState(0);   // 0..1
  const [done, setDone] = useState(false);
  const dragging = useRef(false);
  const baseX = useRef(0);
  const baseP = useRef(0);
  const lastCount = useRef(0);
  const surfRef = useRef();

  const pieceSize = ({ light: 26, normal: 32, beast: 40 })[meatSize] ?? 32;
  const loaded = Math.round(progress * TOTAL);

  // haptic on each newly-threaded piece
  useEffect(() => {
    if (loaded > lastCount.current) {
      haptic('light');
      flash();
    }
    lastCount.current = loaded;
    if (loaded >= TOTAL && !done) {
      setDone(true);
      haptic('heavy');
      flash();
      setTimeout(() => { haptic('success'); }, 260);
    }
  }, [loaded]);

  const range = 300;
  const getX = (e) => (e.touches ? e.touches[0].clientX : e.clientX);
  const onDown = (e) => {
    if (done) return;
    dragging.current = true;
    baseX.current = getX(e);
    baseP.current = progress;
  };
  const onMove = (e) => {
    if (!dragging.current) return;
    const dx = getX(e) - baseX.current;
    const np = Math.max(0, Math.min(1, baseP.current + dx / range));
    setProgress(np);
  };
  const onUp = () => { dragging.current = false; };

  // build pieces threaded so far (meat + fillers)
  const fillers = ['onion', 'pepper', 'tomato'];
  const rodWidth = 320;
  const slot = rodWidth / (TOTAL + 1);

  return (
    <div className="screen" ref={surfRef}
      style={{ padding: 0, userSelect: 'none', cursor: done ? 'default' : 'grab' }}
      onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
      onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp}>

      {/* header */}
      <div style={{ position: 'absolute', top: 76, left: 0, right: 0, textAlign: 'center', zIndex: 5, padding: '0 30px' }}>
        <div className="kicker" style={{ marginBottom: 8 }}>Финальный штрих</div>
        <h2 className="h-1" style={{ marginBottom: 6 }}>{done ? 'Шашлык на мангале! 🔥' : 'Нанижи шашлык'}</h2>
        <p className="sub">{done ? 'Угли раскалились, дым пошёл' : 'Тяни шампур вправо — мясо садится на него кусок за куском'}</p>
      </div>

      {/* progress count */}
      <div style={{ position: 'absolute', top: 210, left: 0, right: 0, textAlign: 'center', zIndex: 5 }}>
        <span style={{ fontSize: 56, fontWeight: 850, letterSpacing: '-.03em', color: done ? 'var(--ember)' : 'var(--txt)' }}>{loaded}</span>
        <span style={{ fontSize: 24, fontWeight: 700, color: 'var(--txt-3)' }}> / {TOTAL}</span>
        <div style={{ fontSize: 14, fontWeight: 700, color: 'var(--txt-3)', marginTop: 2 }}>кусков на шампуре</div>
      </div>

      {/* the interactive skewer */}
      <div style={{ position: 'absolute', top: '46%', left: '50%', transform: 'translate(-50%,-50%)', zIndex: 4 }}>
        <div style={{ position: 'relative', width: rodWidth + 70, height: pieceSize + 30 }}>
          {/* rod */}
          <div style={{
            position: 'absolute', top: '50%', left: 0, transform: 'translateY(-50%)',
            width: rodWidth + 60, height: 7, borderRadius: 4,
            background: 'linear-gradient(180deg,#efe9e0,#a39c93 55%,#6c665f)',
            boxShadow: '0 2px 4px rgba(0,0,0,.5)',
          }} />
          {/* handle ring */}
          <div style={{
            position: 'absolute', top: '50%', left: rodWidth + 52, transform: 'translateY(-50%)',
            width: 22, height: 22, borderRadius: '50%', border: '4px solid #cfc8be',
            boxShadow: !done ? '0 0 0 0 rgba(255,106,26,.6)' : 'none',
            animation: (!done && progress < 0.05) ? 'pulseRing 1.4s infinite' : 'none',
          }} />
          {/* threaded pieces */}
          {Array.from({ length: loaded }).map((_, i) => {
            const type = i % 3 === 1 ? fillers[(Math.floor(i / 3)) % 3] : 'meat';
            const isFiller = type !== 'meat';
            return (
              <div key={i} className={`piece ${type} ${done ? 'cooked' : ''} pop`}
                style={{
                  position: 'absolute', top: '50%',
                  left: (i + 0.4) * slot + 8,
                  width: pieceSize + 'px',
                  height: (isFiller ? pieceSize * 0.82 : pieceSize) + 'px',
                  transform: 'translateY(-50%)',
                }}>
                <div className="char" />
              </div>
            );
          })}
          {/* drag hint arrow */}
          {!done && progress < 0.12 && (
            <div style={{ position: 'absolute', top: '50%', left: rodWidth + 84, transform: 'translateY(-50%)',
              color: 'var(--ember)', fontSize: 28, fontWeight: 800, animation: 'floaty 1.2s infinite' }}>→</div>
          )}
        </div>
      </div>

      {/* mangal scene at bottom */}
      <div style={{ position: 'absolute', left: 0, right: 0, bottom: 30 }}>
        <GrillScene height={190} skewers={0} meatSize={meatSize} lit fire={done} smoke={done ? 0.95 : 0.25} />
      </div>

      {/* done CTA */}
      {done && (
        <div className="rise" style={{ position: 'absolute', left: 22, right: 22, bottom: 46, zIndex: 8 }}>
          <button className="btn btn-primary shine" onClick={onDone}>Показать расчёт&nbsp;&nbsp;🍢</button>
        </div>
      )}
    </div>
  );
}

Object.assign(window, { SignatureSkewer });

  <script type="text/babel">
/* app.jsx — Шашлыкатор: state machine, haptics, theme, scaling, mount */

const { useState: useS, useEffect: useE, useRef: useR, useCallback: useC } = React;

/* ---------- haptics engine (Vibration API + WebAudio tick) ---------- */
function makeHaptics(getOpts) {
  let actx = null;
  const ensure = () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return actx; };
  const patterns = { light: 8, medium: [0, 14], heavy: [0, 22, 30, 22], success: [0, 12, 60, 22], select: 6 };
  const tick = (kind) => {
    const o = getOpts();
    if (!o.sound) return;
    const ax = ensure(); if (!ax) return;
    if (ax.state === 'suspended') ax.resume();
    const t = ax.currentTime;
    const osc = ax.createOscillator(), g = ax.createGain();
    const freq = kind === 'heavy' ? 90 : kind === 'success' ? 520 : 180;
    osc.frequency.value = freq;
    osc.type = kind === 'success' ? 'triangle' : 'sine';
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(kind === 'heavy' ? 0.22 : 0.12, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (kind === 'heavy' ? 0.18 : 0.08));
    osc.connect(g); g.connect(ax.destination);
    osc.start(t); osc.stop(t + 0.2);
  };
  return (kind = 'light') => {
    const o = getOpts();
    if (o.haptics && navigator.vibrate) { try { navigator.vibrate(patterns[kind] || 8); } catch (e) {} }
    tick(kind);
  };
}

/* ---------- persistence ---------- */
const SAVE_KEY = 'shashlykator.v1';
const loadState = () => { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } };
const saveState = (s) => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {} };

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "accent": "#FF6A1A",
  "haptics": true,
  "sound": false
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const saved = useR(loadState());

  const [screen, setScreen] = useS(saved.current.screen || 'hero');   // hero | questions | signature | results
  const [qIndex, setQIndex] = useS(saved.current.qIndex || 0);
  const [answers, setAnswers] = useS(saved.current.answers || { ...SH.DEFAULTS });
  const [results, setResults] = useS(() => SH.calc(saved.current.answers || SH.DEFAULTS));

  const flashRef = useR();
  const optsRef = useR({ haptics: t.haptics, sound: t.sound });
  optsRef.current = { haptics: t.haptics, sound: t.sound };
  const haptic = useR(makeHaptics(() => optsRef.current)).current;

  const flash = useC(() => {
    const el = flashRef.current; if (!el) return;
    el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  }, []);

  // persist
  useE(() => { saveState({ current: { screen, qIndex, answers } }); }, [screen, qIndex, answers]);
  // recompute results whenever answers change
  useE(() => { setResults(SH.calc(answers)); }, [answers]);

  const setAnswer = useC((k, v) => setAnswers((a) => ({ ...a, [k]: v })), []);

  const advance = useC(() => {
    if (qIndex < SH.QUESTIONS.length - 1) setQIndex((i) => i + 1);
    else setScreen('signature');
  }, [qIndex]);

  const restart = useC(() => {
    haptic('medium');
    setAnswers({ ...SH.DEFAULTS });
    setQIndex(0);
    setScreen('hero');
  }, []);

  const start = useC(() => { haptic('medium'); flash(); setQIndex(0); setScreen('questions'); }, []);

  const dark = t.theme === 'dark';

  // screen wrapper with transition
  const [trans, setTrans] = useS('in');
  const lastScreen = useR(screen);
  useE(() => {
    if (lastScreen.current !== screen) { lastScreen.current = screen; setTrans('in'); }
  }, [screen]);

  let content = null;
  if (screen === 'hero') content = <Hero onStart={start} />;
  else if (screen === 'questions') content = <QuestionFlow qIndex={qIndex} answers={answers} setAnswer={setAnswer} onAdvance={advance} haptic={haptic} />;
  else if (screen === 'signature') content = <SignatureSkewer count={answers.count} meatSize={answers.appetite} onDone={() => { haptic('success'); setScreen('results'); }} haptic={haptic} flash={flash} />;
  else if (screen === 'results') content = <Results answers={answers} results={results} onRestart={restart} haptic={haptic} flash={flash} />;

  return (
    <IOSDevice dark={dark}>
    <div className={`app-root ${dark ? '' : 'theme-light'}`} style={{ '--ember': t.accent }}>
      <div className="haptic-flash" ref={flashRef} />
      <div key={screen} className="screen-anim" style={{ position: 'absolute', inset: 0 }}>
        {content}
      </div>

      {/* tiny restart/back affordance (top-right under island) */}
      {screen !== 'hero' && (
        <button onClick={restart} title="Сначала"
          style={{ position: 'absolute', top: 58, right: 18, zIndex: 70, width: 38, height: 38, borderRadius: '50%',
            border: '1px solid var(--line)', background: 'var(--chip)', color: 'var(--txt-2)', fontSize: 17, cursor: 'pointer',
            backdropFilter: 'blur(8px)' }}>↺</button>
      )}

      <TweaksPanel>
        <TweakSection label="Тема" />
        <TweakRadio label="Оформление" value={t.theme} options={['dark', 'light']}
          onChange={(v) => setTweak('theme', v)} />
        <TweakColor label="Акцент огня" value={t.accent}
          options={['#FF6A1A', '#E8420E', '#FF8A2B', '#D7472B']}
          onChange={(v) => setTweak('accent', v)} />
        <TweakSection label="Отклик" />
        <TweakToggle label="Хаптика (вибро)" value={t.haptics} onChange={(v) => setTweak('haptics', v)} />
        <TweakToggle label="Звук" value={t.sound} onChange={(v) => setTweak('sound', v)} />
      </TweaksPanel>
    </div>
    </IOSDevice>
  );
}

/* ---------- mount inside iPhone frame + scale to viewport ---------- */
function Root() {
  return <App />;
}

function mount() {
  const wrap = document.getElementById('device-wrap');
  const root = ReactDOM.createRoot(document.getElementById('app'));
  root.render(<Root />);

  // scale device to fit viewport
  const W = 402, H = 874, pad = 40;
  const fit = () => {
    const s = Math.min((window.innerWidth - pad) / W, (window.innerHeight - pad) / H, 1.15);
    wrap.style.transform = `scale(${s})`;
  };
  fit();
  window.addEventListener('resize', fit);
}

mount();
  </script>
</body>
</html>
